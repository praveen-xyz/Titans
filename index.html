/* ======================= MEDIASTACK NEWS STYLES ======================= */
.news-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 12px;
}

.news-title {
  flex: 1;
  margin: 0;
}

.refresh-button {
  background: var(--card-bg);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--text-color);
}

.refresh-button:hover {
  background: rgba(0, 123, 255, 0.1);
  transform: rotate(180deg);
}

.refresh-button.loading {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.news-categories {
  display: flex;
  gap: 8px;
  margin: 16px 0;
  flex-wrap: wrap;
}

.news-category-btn {
  background: var(--card-bg);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.3s ease;
  color: var(--text-color);
  white-space: nowrap;
}

.news-category-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.news-category-btn:hover:not(.active) {
  background: rgba(0, 123, 255, 0.1);
}

.news-container {
  max-height: calc(100vh - 250px);
  overflow-y: auto;
  padding-right: 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.news-container::-webkit-scrollbar {
  width: 6px;
}

.news-container::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.1);
  border-radius: 3px;
}

.news-container::-webkit-scrollbar-thumb {
  background: var(--accent);
  border-radius: 3px;
}

.news-container::-webkit-scrollbar-thumb:hover {
  background: var(--accent-hover);
}

.news-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 8px 0;
}

.mediastack-news-card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 0;
  box-shadow: 0 4px 15px var(--shadow);
  backdrop-filter: blur(8px);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  border-left: 4px solid var(--accent);
  animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  position: relative;
  overflow: hidden;
}

.mediastack-news-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transition: left 0.5s;
}

.mediastack-news-card:hover::before {
  left: 100%;
}

.mediastack-news-card:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 8px 25px var(--shadow);
}

.mediastack-news-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 10px;
  line-height: 1.3;
  color: var(--text-color);
}

.mediastack-news-description {
  font-size: 0.9rem;
  opacity: 0.8;
  line-height: 1.4;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.mediastack-news-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  opacity: 0.7;
  margin-bottom: 12px;
}

.mediastack-news-source {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

.mediastack-news-date {
  font-size: 0.75rem;
}

.mediastack-news-category {
  background: rgba(0, 123, 255, 0.1);
  color: var(--accent);
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
  display: inline-block;
  margin-bottom: 12px;
}

.mediastack-news-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.85rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.3s ease;
}

.mediastack-news-link:hover {
  transform: translateX(3px);
  color: var(--accent-hover);
}

.news-image-container {
  position: relative;
  width: 100%;
  height: 180px;
  margin-bottom: 12px;
  border-radius: 12px;
  overflow: hidden;
}

.news-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.news-image-placeholder {
  background: var(--gradient);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  height: 100%;
  border-radius: 12px;
}

.mediastack-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
}

.mediastack-loading h4 {
  margin: 20px 0 10px 0;
  color: var(--accent);
}

.mediastack-loading p {
  margin: 0;
  opacity: 0.7;
  font-size: 0.9rem;
}

.mediastack-error {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 40px 20px;
  text-align: center;
  margin: 16px 0;
}

.mediastack-error h4 {
  color: #ff6b6b;
  margin-bottom: 12px;
}

.mediastack-error p {
  opacity: 0.7;
  font-size: 0.9rem;
  margin-bottom: 20px;
}

.retry-button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 10px 20px;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
}

.retry-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
}

.news-counter {
  font-size: 0.8rem;
  opacity: 0.7;
  text-align: center;
  margin-top: 12px;
  padding: 8px;
  background: var(--card-bg);
  border-radius: 12px;
}

/* iOS-specific touch optimizations */
@supports (-webkit-touch-callout: none) {
  .card, .todo-item, .news-card, .event-card, .dev-card, .staff-card {
    -webkit-backface-visibility: hidden;

    transform: translateZ(0);
  }
  
  .slide-menu, .news-container, .chat-messages {
    -webkit-overflow-scrolling: touch;

}

/* --- DARK MODE --- */
const toggle=document.getElementById("darkToggle");
if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark");
updateDarkIcon();
toggle.addEventListener("click",()=>{document.body.classList.toggle("dark");localStorage.setItem("darkMode",document.body.classList.contains("dark"));updateDarkIcon();});
function updateDarkIcon(){const icon=document.body.classList.contains("dark")?"sun":"moon";toggle.innerHTML=`<i data-lucide="${icon}"></i>`;lucide.createIcons();}

/* --- SLIDE MENU --- */
const menuToggle = document.getElementById("menuToggle");
const slideMenu = document.getElementById("slideMenu");
const menuOverlay = document.getElementById("menuOverlay");

menuToggle.addEventListener("click", toggleMenu);

function toggleMenu() {
  slideMenu.classList.toggle("active");
  menuOverlay.classList.toggle("active");
}

function closeMenu() {
  slideMenu.classList.remove("active");
  menuOverlay.classList.remove("active");
}

// Swipe to close functionality
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
});

function handleSwipe() {
  if (slideMenu.classList.contains('active') && touchEndX < touchStartX - 50) {
    closeMenu();
  }
}

/* --- PAGE MANAGEMENT --- */
let currentPage = "main";

function showPage(page) {
  currentPage = page;
  closeMenu();
  
  const content = document.getElementById("mainContent");
  content.classList.remove("tab-content");
  void content.offsetWidth; // Trigger reflow
  content.classList.add("tab-content");
  
  if (page === "events") {
    renderEventsPage();
  } else if (page === "schedule") {
    renderSchedulePage();
  } else if (page === "faculty") {
    renderFacultyPage();
  } else if (page === "about") {
    renderAboutPage();
  }
}

function goBack() {
  currentPage = "main";
  setActiveTab(currentTab);

async function loadMediaStackNews(category) {
  const container = document.getElementById('newsContainer');
  
  try {
    // Show loading state
    container.innerHTML = `
      <div class="mediastack-loading">
        <div class="loading">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
        <h4>Loading ${NEWS_CATEGORIES[category].name}</h4>
        <p>Fetching the latest headlines...</p>
      </div>
    `;
    
    // Build API URL - requesting 50 articles for a scrollable feed
    const categoryParam = NEWS_CATEGORIES[category].param;
    const url = `${MEDIASTACK_BASE_URL}?access_key=${MEDIASTACK_API_KEY}&categories=${categoryParam}&languages=en&limit=50&sort=published_desc`;
    
    const response = await fetch(url);
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();
    
    if (data.error) {
      throw new Error(data.error.info || 'API error');
    }
    
    if (!data.data || data.data.length === 0) {
      throw new Error('No news articles found');
    }
    
    displayMediaStackNews(data.data, category);
    
  } catch (error) {
    console.error('Error loading MediaStack news:', error);
    container.innerHTML = `
      <div class="mediastack-error">
        <h4>Unable to Load News</h4>
        <p>${error.message || 'Please check your internet connection and try again.'}</p>
        <button class="retry-button" onclick="loadMediaStackNews('${category}')">
          <i data-lucide="refresh-cw"></i>
          Try Again
        </button>
      </div>
    `;
    lucide.createIcons();
  }
}

function displayMediaStackNews(newsItems, category) {

    container.innerHTML = `
      <div class="mediastack-error">

        <p>No news articles found for this category.</p>
      </div>
    `;
    return;
  }
  
  let newsHTML = `
    <div class="news-grid">
  `;
  
  newsItems.forEach((article, index) => {
    // Use different images for each article based on category and index
    const imageUrl = getNewsImage(category, index);
    const description = article.description || 'No description available. Click to read more about this story.';
    const source = article.source || 'Unknown Source';
    const publishedAt = formatMediaStackDate(article.published_at);
    const categoryTag = article.category ? article.category.charAt(0).toUpperCase() + article.category.slice(1) : 'General';
    
    // Truncate long titles and descriptions for better UI
    const truncatedTitle = article.title && article.title.length > 100 
      ? article.title.substring(0, 100) + '...' 
      : article.title || 'No Title Available';
      
    const truncatedDesc = description.length > 120 
      ? description.substring(0, 120) + '...' 
      : description;
    
    newsHTML += `
      <div class="mediastack-news-card" style="animation-delay: ${index * 0.05}s">
        <div class="news-image-container">
          <img src="${imageUrl}" alt="${truncatedTitle}" class="news-image">
        </div>
        
        <div class="mediastack-news-category">${categoryTag}</div>
        
        <div class="mediastack-news-title">${truncatedTitle}</div>
        
        <div class="mediastack-news-description">${truncatedDesc}</div>
        
        <div class="mediastack-news-meta">
          <div class="mediastack-news-source">
            <i data-lucide="building"></i>
            ${source}
          </div>
          <div class="mediastack-news-date">${publishedAt}</div>
        </div>
        
        ${article.url ? `
          <a href="${article.url}" target="_blank" class="mediastack-news-link" onclick="trackNewsClick('${category}')">
            Read Full Story
            <i data-lucide="arrow-up-right"></i>
          </a>
        ` : ''}
      </div>
    `;
  });
  
  newsHTML += `
    </div>
    <div class="news-counter">
      Showing ${newsItems.length} news articles • Last updated: ${new Date().toLocaleTimeString()}
    </div>
  `;
  
  container.innerHTML = newsHTML;
  lucide.createIcons();
}

function formatMediaStackDate(dateString) {
  try {
    const date = new Date(dateString);
    const now = new Date();
    const diffTime = Math.abs(now - date);
    const diffHours = Math.floor(diffTime / (1000 * 60 * 60));
    
    if (diffHours < 1) return 'Just now';
    if (diffHours < 24) return `${diffHours}h ago`;
    
    const diffDays = Math.floor(diffHours / 24);
    if (diffDays < 7) return `${diffDays}d ago`;
    
    return date.toLocaleDateString('en-US', { 
      month: 'short', 
      day: 'numeric',
      year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
    });
  } catch {
    return 'Recent';
  }
}

function setupChatInput() {
  const chatInput = document.getElementById("chatInput");
  const sendButton = document.getElementById("sendButton");
  
  // Auto-resize textarea
  chatInput.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = (this.scrollHeight) + "px";
    
    // Enable/disable send button
    sendButton.disabled = this.value.trim() === "";
  });
  
  // Send message on Enter (but allow Shift+Enter for new line)
  chatInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
}

function sendSuggestion(text) {
  document.getElementById("chatInput").value = text;
  sendMessage();
}

async function sendMessage() {
  const chatInput = document.getElementById("chatInput");
  const message = chatInput.value.trim();
  
  if (!message || isTyping) return;
  
  // Clear input and reset height
  chatInput.value = "";
  chatInput.style.height = "auto";
  document.getElementById("sendButton").disabled = true;
  
  // Add user message to chat
  addMessageToChat(message, "user");
  
  // Show typing indicator
  showTypingIndicator();
  
  try {
    // Call Gemini API with the pre-configured key
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `You are a helpful study assistant for college students. Respond to the following query in a friendly, educational manner: ${message}`
          }]
        }]
      })
    });
    
    if (!response.ok) {
      throw new Error(`API request failed with status ${response.status}`);
    }
    
    const data = await response.json();
    
    // Hide typing indicator
    hideTypingIndicator();
    
    // Extract AI response
    const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || 
                      "I'm sorry, I couldn't generate a response. Please try again.";
    
    // Add AI response to chat
    addMessageToChat(aiResponse, "ai");
    
    // Save to chat history
    saveCurrentChat();
    
  } catch (error) {
    console.error("Error calling Gemini API:", error);
    hideTypingIndicator();
    addMessageToChat("Sorry, I encountered an error. Please try again.", "ai");
  }
}

function addMessageToChat(message, sender) {
  const chatMessages = document.getElementById("chatMessages");
  
  // Create message element
  const messageDiv = document.createElement("div");
  messageDiv.className = `message ${sender}-message`;
  messageDiv.textContent = message;
  
  // Add to chat
  chatMessages.appendChild(messageDiv);
  
  // Scroll to bottom
  chatMessages.scrollTop = chatMessages.scrollHeight;
  
  // If this is a new chat, create a chat ID
  if (!currentChatId) {
    currentChatId = `chat_${Date.now()}`;
  }
  
  // Add to current chat in memory
  if (!chatHistory.find(chat => chat.id === currentChatId)) {
    chatHistory.push({
      id: currentChatId,
      title: message.substring(0, 30) + (message.length > 30 ? "..." : ""),
      messages: [],
      timestamp: Date.now()
    });
  }
  
  const currentChat = chatHistory.find(chat => chat.id === currentChatId);
  currentChat.messages.push({
    sender,
    text: message,
    timestamp: Date.now()
  });
  
  // Update chat title with first user message if it's the first message
  if (currentChat.messages.length === 1 && sender === "user") {
    currentChat.title = message.substring(0, 30) + (message.length > 30 ? "..." : "");
  }
}

function showTypingIndicator() {
  isTyping = true;
  const chatMessages = document.getElementById("chatMessages");
  
  const typingDiv = document.createElement("div");
  typingDiv.className = "typing-indicator";

  `;
  
  chatMessages.appendChild(typingDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

  isTyping = false;
  const typingIndicator = document.getElementById("typingIndicator");
  if (typingIndicator) {
    typingIndicator.remove();
  }
}

}

}
