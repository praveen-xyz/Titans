<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titans Student Hub</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --bg-color: #ffffff;
  --text-color: #1a1a1a;
  --card-bg: rgba(255,255,255,0.8);
  --accent: #007bff;
  --shadow: rgba(0,0,0,0.1);
  --gradient: linear-gradient(135deg, #007bff, #00d4ff);
}

body.dark {
  --bg-color: #121212;
  --text-color: #e0e0e0;
  --card-bg: rgba(30,30,30,0.7);
  --accent: #0d6efd;
  --shadow: rgba(255,255,255,0.05);
  --gradient: linear-gradient(135deg, #0d6efd, #007bff);
}

body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color 0.4s, color 0.4s;
  overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ======================= SPLASH SCREEN ======================= */
#splash {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: var(--gradient);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  z-index: 9999;
  overflow: hidden;
  animation: fadeOut 1.3s ease forwards;
  animation-delay: 2.5s;
  transition: all 0.4s ease;
}

#splash-logo {
  font-size: clamp(1.8rem, 5vw, 2.5rem);
  font-weight: 700;
  letter-spacing: 0.5px;
  animation: popIn 1.3s ease;
}

#splash-subtitle {
  font-size: clamp(0.8rem, 3vw, 1rem);
  opacity: 0.8;
  margin-top: 8px;
  letter-spacing: 0.5px;
  animation: fadeIn 1.4s ease 0.6s forwards;
  opacity: 0;
}

@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeOut {
  0% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* Header with integrated news */
header {
  position: sticky;
  top: 0;
  background: var(--gradient);
  color: white;
  padding: 0;
  font-size: 1.3em;
  font-weight: 600;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 0 4px 12px var(--shadow);
  backdrop-filter: blur(10px);
  transform: translateY(-100%);
  animation: slideDown 1.2s ease forwards 2.4s;
  z-index: 100;
  overflow: hidden;
}
@keyframes slideDown { to { transform: translateY(0); } }

.header-content {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px 16px;
  position: relative;
}

.header-title {
  text-align: center;
  flex: 1;
  font-size: 1.2rem;
}

/* Simplified Menu Toggle */
.menu-toggle {
  position: absolute;
  left: 16px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  padding: 8px;
  transition: 0.3s;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.menu-toggle:hover { opacity: 0.8; }

.dark-mode-toggle {
  position: absolute;
  right: 16px;
  background: rgba(255,255,255,0.2);
  border: none;
  border-radius: 50%;
  color: white;
  cursor: pointer;
  padding: 6px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dark-mode-toggle:hover { transform: rotate(20deg); }

/* Integrated News Ticker */
.news-ticker {
  background: rgba(0, 0, 0, 0.15);
  padding: 6px 16px;
  overflow: hidden;
  font-size: 0.75rem;
  font-weight: 500;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
}

.news-icon {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.news-ticker-content {
  display: inline-block;
  white-space: nowrap;
  animation: ticker 25s linear infinite;
}

.news-ticker-content span {
  margin-right: 30px;
}

@keyframes ticker {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

/* Slide Menu */
.slide-menu {
  position: fixed;
  top: 0;
  left: -280px;
  width: 280px;
  height: 100%;
  background: var(--card-bg);
  backdrop-filter: blur(15px);
  box-shadow: 2px 0 15px var(--shadow);
  z-index: 200;
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  overflow-y: auto;
  padding: 20px 0;
}

.slide-menu.active {
  transform: translateX(280px);
}

.menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 199;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

.menu-header {
  padding: 20px;
  border-bottom: 1px solid rgba(0,0,0,0.1);
  margin-bottom: 15px;
}

.menu-header h3 {
  margin: 0;
  color: var(--accent);
  font-size: 1.2rem;
}

.menu-item {
  display: flex;
  align-items: center;
  padding: 15px 20px;
  color: var(--text-color);
  text-decoration: none;
  transition: all 0.3s ease;
  border-left: 4px solid transparent;
}

.menu-item:hover {
  background: rgba(0, 123, 255, 0.1);
  border-left-color: var(--accent);
  transform: translateX(5px);
}

.menu-item i {
  margin-right: 12px;
  width: 20px;
  text-align: center;
}

.content {
  padding: 16px;
  padding-bottom: 80px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInUp 1s ease forwards 2.8s;
}
@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 4px 10px var(--shadow);
  backdrop-filter: blur(8px);
  transition: transform 0.25s ease, background 0.4s, max-height 0.4s ease;
  overflow: hidden;
  max-height: 80px;
  cursor: pointer;
}
.card:hover { transform: scale(1.02); }
.card.expanded { max-height: 300px; }
.card-content { opacity: 0; transition: opacity 0.3s ease; }
.card.expanded .card-content { opacity: 1; }

/* Enhanced Back Button */
.back-button {
  display: inline-flex;
  align-items: center;
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 50px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 16px;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
  position: relative;
  overflow: hidden;
}

.back-button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s;
}

.back-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 123, 255, 0.4);
}

.back-button:hover::before {
  left: 100%;
}

.back-button:active {
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(0, 123, 255, 0.4);
}

.back-button i {
  margin-right: 8px;
  transition: transform 0.3s ease;
}

.back-button:hover i {
  transform: translateX(-3px);
}

/* Mobile Optimized Schedule Table */
.schedule-container {
  overflow-x: auto;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 4px 10px var(--shadow);
  -webkit-overflow-scrolling: touch;
}

.schedule-table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
  font-size: 0.75rem;
}

.schedule-table th, .schedule-table td {
  padding: 8px 6px;
  text-align: left;
  border-bottom: 1px solid rgba(0,0,0,0.1);
  white-space: nowrap;
}

.schedule-table th {
  background: var(--accent);
  color: white;
  font-weight: 600;
  text-align: center;
  position: sticky;
  left: 0;
}

.schedule-table tr:nth-child(even) {
  background: rgba(0,0,0,0.03);
}

.break-row {
  background: rgba(255, 193, 7, 0.1) !important;
  font-weight: 600;
  color: #ff9800;
}

.day-monday { border-left: 4px solid #FF6B6B; }
.day-tuesday { border-left: 4px solid #4ECDC4; }
.day-wednesday { border-left: 4px solid #FFD166; }
.day-thursday { border-left: 4px solid #06D6A0; }
.day-friday { border-left: 4px solid #118AB2; }
.day-saturday { border-left: 4px solid #9B5DE5; }

/* Events Page */
.event-card {
  display: flex;
  margin-bottom: 16px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 10px var(--shadow);
  background: var(--card-bg);
  transition: transform 0.3s ease;
}

.event-card:hover {
  transform: translateY(-3px);
}

.event-date {
  background: var(--accent);
  color: white;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 70px;
}

.event-date .day {
  font-size: 1.3rem;
  font-weight: 700;
}

.event-date .month {
  font-size: 0.8rem;
  opacity: 0.9;
}

.event-details {
  padding: 12px;
  flex: 1;
}

.event-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 4px;
  line-height: 1.2;
}

.event-time {
  font-size: 0.8rem;
  opacity: 0.8;
  margin-bottom: 6px;
}

.event-description {
  font-size: 0.8rem;
  opacity: 0.7;
  line-height: 1.3;
}

/* About Page */
.about-section {
  margin-bottom: 20px;
}

.about-section h3 {
  color: var(--accent);
  margin-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 4px;
  font-size: 1.1rem;
}

.dev-card {
  display: flex;
  align-items: center;
  padding: 12px;
  background: var(--card-bg);
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 4px 10px var(--shadow);
  transition: transform 0.3s ease;
}

.dev-card:hover {
  transform: translateX(3px);
}

.dev-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 1rem;
  margin-right: 12px;
  flex-shrink: 0;
}

.dev-info h4 {
  margin: 0 0 4px 0;
  font-size: 1rem;
}

.dev-info p {
  margin: 0;
  opacity: 0.8;
  font-size: 0.8rem;
}

/* News Card Styles */
.news-card {
  max-height: none;
  cursor: default;
  margin-bottom: 16px;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.news-card:hover {
  transform: translateY(-3px);
}

.news-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.2;
}

.news-description {
  font-size: 0.8rem;
  opacity: 0.8;
  line-height: 1.3;
  margin-bottom: 8px;
}

.news-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  opacity: 0.7;
}

.news-link {
  color: var(--accent);
  font-size: 0.7rem;
  text-decoration: none;
  display: inline-block;
  margin-top: 6px;
  font-weight: 600;
}

.news-link:hover {
  text-decoration: underline;
}

/* Mobile Optimized Navigation */
nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: var(--card-bg);
  display: flex;
  justify-content: space-around;
  border-top: 1px solid #ccc;
  padding: 8px 0;
  backdrop-filter: blur(10px);
  z-index: 10;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}
nav button {
  background: none;
  border: none;
  color: var(--text-color);
  font-size: 1em;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  flex: 1;
  padding: 6px 0;
  position: relative;
}
nav button.active { 
  color: var(--accent); 
  transform: translateY(-6px);
}
nav button.active::after {
  content: '';
  position: absolute;
  bottom: -8px;
  width: 4px;
  height: 4px;
  background: var(--accent);
  border-radius: 50%;
}
nav button span {
  font-size: 0.65rem;
  margin-top: 2px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
  background-color: var(--card-bg);
  color: var(--text-color);
  backdrop-filter: blur(6px);
  font-size: 0.9em;
  transition: 0.3s;
  box-sizing: border-box;
}
input:focus {
  outline: none;
  border: 1px solid var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

button.primary {
  background-color: var(--accent);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.9em;
  transition: 0.3s ease;
}
button.primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.todo-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.3s ease;
}
.todo-text { flex: 1; margin-left: 8px; word-break: break-word; transition: 0.3s; font-size: 0.9rem; }
.todo-item.completed .todo-text { text-decoration: line-through; opacity: 0.6; }
.todo-buttons { display: flex; gap: 4px; }

.fade-in { animation: fadeIn 0.5s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.slide-out { animation: slideOut 0.4s forwards; }
@keyframes slideOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(40px); }
}

/* --- Chat Animation --- */
.typing {
  display: inline-block;
  width: 1ch;
  overflow: hidden;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Loading animation */
.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.loading-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--accent);
  margin: 0 3px;
  animation: loading 1.4s ease-in-out infinite both;
}

.loading-dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes loading {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* Improved animations for iOS-like smoothness */
.card, .todo-item, .news-card, .event-card, .dev-card {
  animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
}

@keyframes cardAppear {
  0% { opacity: 0; transform: translateY(20px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Tab transition */
.tab-content {
  animation: tabSwitch 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}

@keyframes tabSwitch {
  0% { opacity: 0; transform: translateX(20px); }
  100% { opacity: 1; transform: translateX(0); }
}

/* Mobile-first responsive design */
@media (max-width: 480px) {
  .header-title {
    font-size: 1.1rem;
  }
  
  .content {
    padding: 12px;
    padding-bottom: 70px;
  }
  
  .card {
    padding: 10px;
    margin-bottom: 10px;
  }
  
  nav button span {
    font-size: 0.6rem;
  }
  
  .event-date {
    min-width: 60px;
    padding: 10px;
  }
  
  .event-date .day {
    font-size: 1.1rem;
  }
  
  .dev-avatar {
    width: 45px;
    height: 45px;
    font-size: 0.9rem;
  }
}

/* Prevent horizontal scroll on mobile */
html, body {
  max-width: 100%;
  overflow-x: hidden;
}

/* ======================= AI CHAT STYLES ======================= */
.chat-container {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 200px);
  max-height: 500px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px var(--shadow);
  background: var(--card-bg);
  backdrop-filter: blur(8px);
}

.chat-header {
  background: var(--gradient);
  color: white;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.chat-header h3 {
  margin: 0;
  font-size: 1rem;
}

.chat-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  opacity: 0.9;
}

.status-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ade80;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 18px;
  line-height: 1.4;
  font-size: 0.9rem;
  animation: messageSlide 0.3s ease-out;
}

@keyframes messageSlide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.user-message {
  align-self: flex-end;
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 4px;
}

.ai-message {
  align-self: flex-start;
  background: var(--card-bg);
  border: 1px solid rgba(0,0,0,0.1);
  border-bottom-left-radius: 4px;
}

.typing-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  background: var(--card-bg);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  align-self: flex-start;
  font-size: 0.8rem;
  color: var(--text-color);
  opacity: 0.7;
}

.typing-dots {
  display: flex;
  gap: 3px;
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: typing 1.4s infinite ease-in-out;
}

.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes typing {
  0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

.chat-input-container {
  display: flex;
  padding: 12px;
  gap: 8px;
  border-top: 1px solid rgba(0,0,0,0.1);
  background: var(--card-bg);
}

.chat-input {
  flex: 1;
  border-radius: 24px;
  padding: 10px 16px;
  border: 1px solid rgba(0,0,0,0.1);
  background: var(--bg-color);
  color: var(--text-color);
  font-size: 0.9rem;
  resize: none;
  max-height: 100px;
  transition: all 0.3s ease;
}

.chat-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
}

.send-button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  flex-shrink: 0;
}

.send-button:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
}

.send-button:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.chat-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 12px 12px;
  background: var(--card-bg);
}

.suggestion-chip {
  background: rgba(0, 123, 255, 0.1);
  color: var(--accent);
  border: 1px solid rgba(0, 123, 255, 0.2);
  border-radius: 16px;
  padding: 6px 12px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.suggestion-chip:hover {
  background: rgba(0, 123, 255, 0.2);
  transform: translateY(-2px);
}

.chat-actions {
  display: flex;
  justify-content: flex-end;
  padding: 8px 12px;
  background: var(--card-bg);
  border-top: 1px solid rgba(0,0,0,0.1);
}

.clear-chat-button {

    category: "Campus"

  },

    description: "Merit-based scholarship applications for the next academic year are now being accepted. Deadline is March 15.",
    date: "2 days ago",
    category: "Financial"
  }
];

async function loadNews() {
  const container = document.getElementById("newsContainer");
  
  // First show manual news
  let newsHTML = `
    <h3 style="margin-top: 16px; font-size: 1.1rem;">Campus Updates</h3>
  `;
  
  manualNews.forEach(news => {
    newsHTML += `
      <div class="card news-card">
        <div class="news-title">${news.title}</div>
        <div class="news-description">${news.description}</div>
        <div class="news-meta">
          <span>${news.category}</span>
          <span>${news.date}</span>
        </div>
      </div>
    `;
  });
  
  // Add external news section
  newsHTML += `
    <h3 style="margin-top: 16px; font-size: 1.1rem;">Technology News</h3>
    <div id="externalNews"></div>
  `;
  
  container.innerHTML = newsHTML;
  
  // Then load external news
  await loadExternalNews();
}

async function loadExternalNews() {
  const externalContainer = document.getElementById("externalNews");
  
  try {
    // Show loading state
    externalContainer.innerHTML = `
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    `;

    // Fetch real news from NewsAPI - Technology category
    const response = await fetch(`https://newsapi.org/v2/top-headlines?category=technology&language=en&pageSize=6&apiKey=${NEWS_API_KEY}`);
    
    if (!response.ok) {
      throw new Error(`News API request failed with status ${response.status}`);
    }
    
    const data = await response.json();
    
    let externalHTML = "";
    
    if (data.articles && data.articles.length > 0) {
      data.articles.forEach(article => {
        if (article.title && article.title !== "[Removed]") {
          const description = article.description || 'No description available';
          const truncatedDescription = description.length > 120 ? description.substring(0, 120) + '...' : description;
          
          externalHTML += `
            <div class="card news-card">
              <div class="news-title">${article.title}</div>
              <div class="news-description">${truncatedDescription}</div>
              <div class="news-meta">
                <span>${article.source?.name || 'Unknown Source'}</span>
                <span>${new Date(article.publishedAt).toLocaleDateString()}</span>
              </div>
              ${article.url ? `<a href="${article.url}" target="_blank" class="news-link">Read full article →</a>` : ''}
            </div>
          `;
        }
      });
    } else {
      externalHTML = `
        <div class="card">
          <p>No technology news available at the moment. Please check back later.</p>
        </div>
      `;
    }
    
    externalContainer.innerHTML = externalHTML;
    
  } catch (error) {
    console.error("Error loading external news:", error);
    externalContainer.innerHTML = `
      <div class="card">
        <p>Unable to load external news at this time. Please check your connection.</p>
        <p style="font-size: 0.7rem; opacity: 0.7;">Error: ${error.message}</p>
      </div>
    `;
  }
}

/* ======================= AI CHAT IMPLEMENTATION ======================= */
let chatHistory = [];
let currentChatId = null;
let isTyping = false;

// Initialize chat from localStorage
function loadChatHistory() {
  const saved = localStorage.getItem("chatHistory");
  chatHistory = saved ? JSON.parse(saved) : [];
}

function saveChatHistory() {
  localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
}

function renderAIChat() {
  const content = document.getElementById("mainContent");
  
  content.innerHTML = `
    <h2>AI Chat Assistant</h2>
    
    <div class="api-key-container" style="display: none;">
      <label for="apiKeyInput">Gemini API Key:</label>
      <div class="api-key-input">
        <input type="password" id="apiKeyInput" placeholder="Enter your Gemini API key..." />
        <button class="primary" onclick="saveApiKey()">Save</button>
      </div>
      <div id="apiKeyStatus" class="api-key-status valid">
        ✅ API Key is pre-configured and ready to use!
      </div>
    </div>
    
    <div class="chat-container">
      <div class="chat-header">
        <i data-lucide="bot"></i>
        <h3>Titan AI Assistant</h3>
        <div class="chat-status">
          <div class="status-indicator"></div>
          <span>Online</span>
        </div>
      </div>
      
      <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">
          Hi! I'm your AI study assistant. I can help with homework, explain concepts, or just chat about your studies. How can I assist you today?
        </div>
      </div>
      
      <div class="chat-suggestions" id="chatSuggestions">
        <div class="suggestion-chip" onclick="sendSuggestion('Explain data structures')">Explain data structures</div>
        <div class="suggestion-chip" onclick="sendSuggestion('Help with calculus homework')">Help with calculus</div>
        <div class="suggestion-chip" onclick="sendSuggestion('What is machine learning?')">What is ML?</div>
        <div class="suggestion-chip" onclick="sendSuggestion('Give me study tips')">Study tips</div>
      </div>
      
      <div class="chat-input-container">
        <textarea class="chat-input" id="chatInput" placeholder="Type your message..." rows="1"></textarea>
        <button class="send-button" id="sendButton" onclick="sendMessage()">
          <i data-lucide="send"></i>
        </button>
      </div>
      
      <div class="chat-actions">
        <button class="clear-chat-button" onclick="clearChat()">
          <i data-lucide="trash-2"></i>
          Clear Chat
        </button>
      </div>
    </div>
    
    <div class="chat-history" id="chatHistorySection" style="display: none;">
      <h3>Chat History</h3>
      <div id="chatHistoryList"></div>
    </div>
  `;
  
  lucide.createIcons();
  
  // Initialize chat
  loadChatHistory();
  setupChatInput();
  
  // Load current chat if exists
  if (currentChatId) {
    loadChat(currentChatId);
  }
}

function setupChatInput() {
  const chatInput = document.getElementById("chatInput");
  const sendButton = document.getElementById("sendButton");
  
  // Auto-resize textarea
  chatInput.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = (this.scrollHeight) + "px";
    
    // Enable/disable send button
    sendButton.disabled = this.value.trim() === "";
  });
  
  // Send message on Enter (but allow Shift+Enter for new line)
  chatInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
}

function sendSuggestion(text) {
  document.getElementById("chatInput").value = text;
  sendMessage();
}

async function sendMessage() {
  const chatInput = document.getElementById("chatInput");
  const message = chatInput.value.trim();
  
  if (!message || isTyping) return;
  
  // Clear input and reset height
  chatInput.value = "";
  chatInput.style.height = "auto";
  document.getElementById("sendButton").disabled = true;
  
  // Add user message to chat
  addMessageToChat(message, "user");
  
  // Show typing indicator
  showTypingIndicator();
  
  try {
    // Call Gemini API with the pre-configured key
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `You are a helpful study assistant for college students. Respond to the following query in a friendly, educational manner: ${message}`
          }]
        }]
      })
    });
    
    if (!response.ok) {
      throw new Error(`API request failed with status ${response.status}`);
    }
    
    const data = await response.json();
    
    // Hide typing indicator
    hideTypingIndicator();
    
    // Extract AI response
    const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || 
                      "I'm sorry, I couldn't generate a response. Please try again.";
    
    // Add AI response to chat
    addMessageToChat(aiResponse, "ai");
    
    // Save to chat history
    saveCurrentChat();
    
  } catch (error) {
    console.error("Error calling Gemini API:", error);
    hideTypingIndicator();
    addMessageToChat("Sorry, I encountered an error. Please try again.", "ai");
  }
}

function addMessageToChat(message, sender) {
  const chatMessages = document.getElementById("chatMessages");
  
  // Create message element
  const messageDiv = document.createElement("div");
  messageDiv.className = `message ${sender}-message`;
  messageDiv.textContent = message;
  
  // Add to chat
  chatMessages.appendChild(messageDiv);
  
  // Scroll to bottom
  chatMessages.scrollTop = chatMessages.scrollHeight;
  
  // If this is a new chat, create a chat ID
  if (!currentChatId) {
    currentChatId = `chat_${Date.now()}`;
  }
  
  // Add to current chat in memory
  if (!chatHistory.find(chat => chat.id === currentChatId)) {
    chatHistory.push({
      id: currentChatId,
      title: message.substring(0, 30) + (message.length > 30 ? "..." : ""),
      messages: [],
      timestamp: Date.now()
    });
  }
  
  const currentChat = chatHistory.find(chat => chat.id === currentChatId);
  currentChat.messages.push({
    sender,
    text: message,
    timestamp: Date.now()
  });
  
  // Update chat title with first user message if it's the first message
  if (currentChat.messages.length === 1 && sender === "user") {
    currentChat.title = message.substring(0, 30) + (message.length > 30 ? "..." : "");
  }
}

function showTypingIndicator() {
  isTyping = true;
  const chatMessages = document.getElementById("chatMessages");
  
  const typingDiv = document.createElement("div");
  typingDiv.className = "typing-indicator";
  typingDiv.id = "typingIndicator";
  typingDiv.innerHTML = `
    <span>AI is typing</span>
    <div class="typing-dots">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  
  chatMessages.appendChild(typingDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function hideTypingIndicator() {
  isTyping = false;
  const typingIndicator = document.getElementById("typingIndicator");
  if (typingIndicator) {
    typingIndicator.remove();
  }
}

function clearChat() {
  const chatMessages = document.getElementById("chatMessages");
  chatMessages.innerHTML = '<div class="message ai-message">Hi! I\'m your AI study assistant. How can I help you today?</div>';
  
  // Reset current chat
  currentChatId = null;
  
  // Scroll to top
  chatMessages.scrollTop = 0;
}

function saveCurrentChat() {
  saveChatHistory();
}
