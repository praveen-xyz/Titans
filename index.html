<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titans Student Hub</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --bg-color: #ffffff;
  --text-color: #1a1a1a;
  --card-bg: rgba(255,255,255,0.8);
  --accent: #007bff;
  --shadow: rgba(0,0,0,0.1);
  --gradient: linear-gradient(135deg, #007bff, #00d4ff);
}

body.dark {
  --bg-color: #121212;
  --text-color: #e0e0e0;
  --card-bg: rgba(30,30,30,0.7);
  --accent: #0d6efd;
  --shadow: rgba(255,255,255,0.05);
  --gradient: linear-gradient(135deg, #0d6efd, #007bff);
}

body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color 0.4s, color 0.4s;
  overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ======================= SPLASH SCREEN ======================= */
#splash {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: var(--gradient);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  z-index: 9999;
  overflow: hidden;
  animation: fadeOut 1.3s ease forwards;
  animation-delay: 2.5s;
  transition: all 0.4s ease;
}

#splash-logo {
  font-size: clamp(1.8rem, 5vw, 2.5rem);
  font-weight: 700;
  letter-spacing: 0.5px;
  animation: popIn 1.3s ease;
}

#splash-subtitle {
  font-size: clamp(0.8rem, 3vw, 1rem);
  opacity: 0.8;
  margin-top: 8px;
  letter-spacing: 0.5px;
  animation: fadeIn 1.4s ease 0.6s forwards;
  opacity: 0;
}

@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeOut {
  0% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* Header with integrated news */
header {
  position: sticky;
  top: 0;
  background: var(--gradient);
  color: white;
  padding: 0;
  font-size: 1.3em;
  font-weight: 600;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 0 4px 12px var(--shadow);
  backdrop-filter: blur(10px);
  transform: translateY(-100%);
  animation: slideDown 1.2s ease forwards 2.4s;
  z-index: 100;
  overflow: hidden;
}
@keyframes slideDown { to { transform: translateY(0); } }

.header-content {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px 16px;
  position: relative;
}

.header-title {
  text-align: center;
  flex: 1;
  font-size: 1.2rem;
}

/* Simplified Menu Toggle */
.menu-toggle {
  position: absolute;
  left: 16px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  padding: 8px;
  transition: 0.3s;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.menu-toggle:hover { opacity: 0.8; }

.dark-mode-toggle {
  position: absolute;
  right: 16px;
  background: rgba(255,255,255,0.2);
  border: none;
  border-radius: 50%;
  color: white;
  cursor: pointer;
  padding: 6px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dark-mode-toggle:hover { transform: rotate(20deg); }

/* Integrated News Ticker */
.news-ticker {
  background: rgba(0, 0, 0, 0.15);
  padding: 6px 16px;
  overflow: hidden;
  font-size: 0.75rem;
  font-weight: 500;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
}

.news-icon {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.news-ticker-content {
  display: inline-block;
  white-space: nowrap;
  animation: ticker 25s linear infinite;
}

.news-ticker-content span {
  margin-right: 30px;
}

@keyframes ticker {
  0% { transform: translateX(100%); }
  100% { transform: translateX(-100%); }
}

/* Slide Menu */
.slide-menu {
  position: fixed;
  top: 0;
  left: -280px;
  width: 280px;
  height: 100%;
  background: var(--card-bg);
  backdrop-filter: blur(15px);
  box-shadow: 2px 0 15px var(--shadow);
  z-index: 200;
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  overflow-y: auto;
  padding: 20px 0;
}

.slide-menu.active {
  transform: translateX(280px);
}

.menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 199;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

.menu-header {
  padding: 20px;
  border-bottom: 1px solid rgba(0,0,0,0.1);
  margin-bottom: 15px;
}

.menu-header h3 {
  margin: 0;
  color: var(--accent);
  font-size: 1.2rem;
}

.menu-item {
  display: flex;
  align-items: center;
  padding: 15px 20px;
  color: var(--text-color);
  text-decoration: none;
  transition: all 0.3s ease;
  border-left: 4px solid transparent;
}

.menu-item:hover {
  background: rgba(0, 123, 255, 0.1);
  border-left-color: var(--accent);
  transform: translateX(5px);
}

.menu-item i {
  margin-right: 12px;
  width: 20px;
  text-align: center;
}

.content {
  padding: 16px;
  padding-bottom: 80px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInUp 1s ease forwards 2.8s;
}
@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 4px 10px var(--shadow);
  backdrop-filter: blur(8px);
  transition: transform 0.25s ease, background 0.4s, max-height 0.4s ease;
  overflow: hidden;
  max-height: 80px;
  cursor: pointer;
}
.card:hover { transform: scale(1.02); }
.card.expanded { max-height: 300px; }
.card-content { opacity: 0; transition: opacity 0.3s ease; }
.card.expanded .card-content { opacity: 1; }

/* Enhanced Back Button */
.back-button {
  display: inline-flex;
  align-items: center;
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 50px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 16px;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
  position: relative;
  overflow: hidden;
}

.back-button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s;
}

.back-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 123, 255, 0.4);
}

.back-button:hover::before {
  left: 100%;
}

.back-button:active {
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(0, 123, 255, 0.4);
}

.back-button i {
  margin-right: 8px;
  transition: transform 0.3s ease;
}

.back-button:hover i {
  transform: translateX(-3px);
}

/* Mobile Optimized Schedule Table */
.schedule-container {
  overflow-x: auto;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 4px 10px var(--shadow);
  -webkit-overflow-scrolling: touch;
}

.schedule-table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
  font-size: 0.75rem;
}

.schedule-table th, .schedule-table td {
  padding: 8px 6px;
  text-align: left;
  border-bottom: 1px solid rgba(0,0,0,0.1);
  white-space: nowrap;
}

.schedule-table th {
  background: var(--accent);
  color: white;
  font-weight: 600;
  text-align: center;
  position: sticky;
  left: 0;
}

.schedule-table tr:nth-child(even) {
  background: rgba(0,0,0,0.03);
}

.break-row {
  background: rgba(255, 193, 7, 0.1) !important;
  font-weight: 600;
  color: #ff9800;
}

.day-monday { border-left: 4px solid #FF6B6B; }
.day-tuesday { border-left: 4px solid #4ECDC4; }
.day-wednesday { border-left: 4px solid #FFD166; }
.day-thursday { border-left: 4px solid #06D6A0; }
.day-friday { border-left: 4px solid #118AB2; }
.day-saturday { border-left: 4px solid #9B5DE5; }

/* Events Page */
.event-card {
  display: flex;
  margin-bottom: 16px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 10px var(--shadow);
  background: var(--card-bg);
  transition: transform 0.3s ease;
}

.event-card:hover {
  transform: translateY(-3px);
}

.event-date {
  background: var(--accent);
  color: white;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 70px;
}

.event-date .day {
  font-size: 1.3rem;
  font-weight: 700;
}

.event-date .month {
  font-size: 0.8rem;
  opacity: 0.9;
}

.event-details {
  padding: 12px;
  flex: 1;
}

.event-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 4px;
  line-height: 1.2;
}

.event-time {
  font-size: 0.8rem;
  opacity: 0.8;
  margin-bottom: 6px;
}

.event-description {
  font-size: 0.8rem;
  opacity: 0.7;
  line-height: 1.3;
}

/* About Page */
.about-section {
  margin-bottom: 20px;
}

.about-section h3 {
  color: var(--accent);
  margin-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 4px;
  font-size: 1.1rem;
}

.dev-card {
  display: flex;
  align-items: center;
  padding: 12px;
  background: var(--card-bg);
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 4px 10px var(--shadow);
  transition: transform 0.3s ease;
}

.dev-card:hover {
  transform: translateX(3px);
}

.dev-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 1rem;
  margin-right: 12px;
  flex-shrink: 0;
}

.dev-info h4 {
  margin: 0 0 4px 0;
  font-size: 1rem;
}

.dev-info p {
  margin: 0;
  opacity: 0.8;
  font-size: 0.8rem;
}

/* News Card Styles */
.news-card {
  max-height: none;
  cursor: default;
  margin-bottom: 16px;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.news-card:hover {
  transform: translateY(-3px);
}

.news-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.2;
}

.news-description {
  font-size: 0.8rem;
  opacity: 0.8;
  line-height: 1.3;
  margin-bottom: 8px;
}

.news-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  opacity: 0.7;
}

/* Mobile Optimized Navigation */
nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: var(--card-bg);
  display: flex;
  justify-content: space-around;
  border-top: 1px solid #ccc;
  padding: 8px 0;
  backdrop-filter: blur(10px);
  z-index: 10;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}
nav button {
  background: none;
  border: none;
  color: var(--text-color);
  font-size: 1em;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  flex: 1;
  padding: 6px 0;
  position: relative;
}
nav button.active { 
  color: var(--accent); 
  transform: translateY(-6px);
}
nav button.active::after {
  content: '';
  position: absolute;
  bottom: -8px;
  width: 4px;
  height: 4px;
  background: var(--accent);
  border-radius: 50%;
}
nav button span {
  font-size: 0.65rem;
  margin-top: 2px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
  background-color: var(--card-bg);
  color: var(--text-color);
  backdrop-filter: blur(6px);
  font-size: 0.9em;
  transition: 0.3s;
  box-sizing: border-box;
}
input:focus {
  outline: none;
  border: 1px solid var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

button.primary {
  background-color: var(--accent);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.9em;
  transition: 0.3s ease;
}
button.primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.todo-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.3s ease;
}
.todo-text { flex: 1; margin-left: 8px; word-break: break-word; transition: 0.3s; font-size: 0.9rem; }
.todo-item.completed .todo-text { text-decoration: line-through; opacity: 0.6; }
.todo-buttons { display: flex; gap: 4px; }

.fade-in { animation: fadeIn 0.5s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.slide-out { animation: slideOut 0.4s forwards; }
@keyframes slideOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(40px); }
}

/* --- Chat Animation --- */
.typing {
  display: inline-block;
  width: 1ch;
  overflow: hidden;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Loading animation */
.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.loading-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--accent);
  margin: 0 3px;
  animation: loading 1.4s ease-in-out infinite both;
}

.loading-dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes loading {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* Improved animations for iOS-like smoothness */
.card, .todo-item, .news-card, .event-card, .dev-card {
  animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
}

@keyframes cardAppear {
  0% { opacity: 0; transform: translateY(20px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Tab transition */
.tab-content {
  animation: tabSwitch 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}

@keyframes tabSwitch {
  0% { opacity: 0; transform: translateX(20px); }
  100% { opacity: 1; transform: translateX(0); }
}

/* Mobile-first responsive design */
@media (max-width: 480px) {
  .header-title {
    font-size: 1.1rem;
  }
  
  .content {
    padding: 12px;
    padding-bottom: 70px;
  }
  
  .card {
    padding: 10px;
    margin-bottom: 10px;
  }
  
  nav button span {
    font-size: 0.6rem;
  }
  
  .event-date {
    min-width: 60px;
    padding: 10px;
  }
  
  .event-date .day {
    font-size: 1.1rem;
  }
  
  .dev-avatar {
    width: 45px;
    height: 45px;
    font-size: 0.9rem;
  }
}

/* Prevent horizontal scroll on mobile */
html, body {
  max-width: 100%;
  overflow-x: hidden;
}
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <div id="splash-logo">Titans Student Hub</div>
  <div id="splash-subtitle">Connecting Learners ⚡</div>
</div>

<!-- Slide Menu -->
<div class="slide-menu" id="slideMenu">
  <div class="menu-header">
    <h3>Menu</h3>
  </div>
  <a href="#" class="menu-item" onclick="showPage('events')">
    <i data-lucide="calendar"></i>
    <span>Events</span>
  </a>
  <a href="#" class="menu-item" onclick="showPage('schedule')">
    <i data-lucide="clock"></i>
    <span>Schedule</span>
  </a>
  <a href="#" class="menu-item" onclick="showPage('about')">
    <i data-lucide="info"></i>
    <span>About</span>
  </a>
</div>

<!-- Menu Overlay -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- Header with integrated news ticker -->
<header>
  <div class="header-content">
    <button class="menu-toggle" id="menuToggle">
      <i data-lucide="menu"></i>
    </button>
    <div class="header-title">Titans Student Hub</div>
    <button class="dark-mode-toggle" id="darkToggle"><i data-lucide="moon"></i></button>
  </div>
  <div class="news-ticker">
    <div class="news-icon">
      <span></span>
    </div>
    <div class="news-ticker-content">
      <span>🚀 Welcome to Titans Student Hub! New features added today.</span>
      <span>📚 Mid-term exams starting next week - Check your schedule!</span>
      <span>🎉 Tech Fest 2023 registration now open!</span>
      <span>📢 Student council elections next month</span>
    </div>
  </div>
</header>

<div class="content" id="mainContent"></div>

<nav>
  <button id="tasksTab" onclick="setActiveTab('tasks')"><i data-lucide='book-open'></i><span>Tasks</span></button>
  <button id="todoTab" onclick="setActiveTab('todo')"><i data-lucide='check-circle'></i><span>To-Do</span></button>
  <button id="newsTab" onclick="setActiveTab('news')"><i data-lucide='newspaper'></i><span>News</span></button>
  <button id="chatTab" onclick="setActiveTab('chat')"><i data-lucide='bot'></i><span>AI Chat</span></button>
  <button id="socialTab" onclick="setActiveTab('social')"><i data-lucide='users'></i><span>Social</span></button>
</nav>

<script>
/* --- DARK MODE --- */
const toggle=document.getElementById("darkToggle");
if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark");
updateDarkIcon();
toggle.addEventListener("click",()=>{document.body.classList.toggle("dark");localStorage.setItem("darkMode",document.body.classList.contains("dark"));updateDarkIcon();});
function updateDarkIcon(){const icon=document.body.classList.contains("dark")?"sun":"moon";toggle.innerHTML=`<i data-lucide="${icon}"></i>`;lucide.createIcons();}

/* --- SLIDE MENU --- */
const menuToggle = document.getElementById("menuToggle");
const slideMenu = document.getElementById("slideMenu");
const menuOverlay = document.getElementById("menuOverlay");

menuToggle.addEventListener("click", toggleMenu);

function toggleMenu() {
  slideMenu.classList.toggle("active");
  menuOverlay.classList.toggle("active");
}

function closeMenu() {
  slideMenu.classList.remove("active");
  menuOverlay.classList.remove("active");
}

// Swipe to close functionality
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
});

function handleSwipe() {
  if (slideMenu.classList.contains('active') && touchEndX < touchStartX - 50) {
    closeMenu();
  }
}

/* --- PAGE MANAGEMENT --- */
let currentPage = "main";

function showPage(page) {
  currentPage = page;
  closeMenu();
  
  const content = document.getElementById("mainContent");
  content.classList.remove("tab-content");
  void content.offsetWidth; // Trigger reflow
  content.classList.add("tab-content");
  
  if (page === "events") {
    renderEventsPage();
  } else if (page === "schedule") {
    renderSchedulePage();
  } else if (page === "about") {
    renderAboutPage();
  }
}

function goBack() {
  currentPage = "main";
  setActiveTab(currentTab);
}

function renderEventsPage() {
  const content = document.getElementById("mainContent");
  content.innerHTML = `
    <button class="back-button" onclick="goBack()">
      <i data-lucide="arrow-left"></i>
      Back to Main
    </button>
    <h2>College Events</h2>
    <div class="event-card">
      <div class="event-date">
        <div class="day">07</div>
        <div class="month">NOV</div>
      </div>
      <div class="event-details">
        <div class="event-title">PSNA TECKNOWFEST'2025</div>
        <div class="event-time">9:00 AM - 5:00 PM | Main Auditorium | Reg fee: 200</div>
        <div class="event-description">Paper presentation, decodex, web innovate, ideathon, code quest arena, talentra</div>
      </div>
    </div>
    <div class="event-card">
      <div class="event-date">
        <div class="day">22</div>
        <div class="month">OCT</div>
      </div>
      <div class="event-details">
        <div class="event-title">Career Fair</div>

/* --- TAB HANDLING --- */
let currentTab = "todo";

function setActiveTab(tab){
  currentPage = "main";
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(tab+"Tab").classList.add("active");
  
  // Add tab transition effect
  const content = document.getElementById("mainContent");
  content.classList.remove("tab-content");
  void content.offsetWidth; // Trigger reflow
  content.classList.add("tab-content");
  
  renderTab(tab);
  currentTab = tab;
}

/* --- TODO --- */
let todos=[];
function loadTodos(){const saved=localStorage.getItem("todos");todos=saved?JSON.parse(saved):[];renderTodos();}
function saveTodos(){localStorage.setItem("todos",JSON.stringify(todos));}
function addTodo(){const input=document.getElementById("todoInput");const text=input.value.trim();if(!text)return;todos.push({id:Date.now(),text,completed:false});saveTodos();renderTodos();input.value="";}
function toggleTodo(id){const todo=todos.find(t=>t.id===id);todo.completed=!todo.completed;saveTodos();renderTodos();}
function deleteTodo(id){const el=document.querySelector(`[data-id='${id}']`);el.classList.add("slide-out");setTimeout(()=>{todos=todos.filter(t=>t.id!==id);saveTodos();renderTodos();},350);}
function renderTodos(){const list=document.getElementById("todoList");if(!list)return;list.innerHTML="";todos.forEach(t=>{const div=document.createElement("div");div.className=`card todo-item fade-in ${t.completed?"completed":""}`;div.dataset.id=t.id;div.innerHTML=`<div class='todo-text'>${t.text}</div><div class='todo-buttons'><button class='primary' style='background:${t.completed?"orange":"limegreen"};padding:6px 8px;' onclick='toggleTodo(${t.id})'><i data-lucide='${t.completed?"rotate-ccw":"check"}'></i></button><button class='primary' style='background:red;padding:6px 8px;' onclick='deleteTodo(${t.id})'><i data-lucide='trash-2'></i></button></div>`;list.appendChild(div);});lucide.createIcons();}

/* --- GEMINI CHAT --- */
async function sendMessage(){
  const input=document.getElementById("chatInput");
  const chatBox=document.getElementById("chatBox");
  const userMsg=input.value.trim();
  if(!userMsg)return;

  const userDiv=document.createElement("div");
  userDiv.className="fade-in";
  userDiv.innerHTML=`<strong>You:</strong> ${userMsg}`;
  chatBox.appendChild(userDiv);

  const typingDiv=document.createElement("div");
  typingDiv.className="fade-in";
  typingDiv.innerHTML=`<strong>AI:</strong> <span class="typing">...</span>`;
  chatBox.appendChild(typingDiv);
  chatBox.scrollTop=chatBox.scrollHeight;

  const GEMINI_API_KEY="PASTE_YOUR_GEMINI_API_KEY_HERE";
  let replyText="Hmm... I couldn't fetch a response.";

  try{
    const response=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key="+GEMINI_API_KEY,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:userMsg}]}]})
    });
    const data=await response.json();
    replyText=data?.candidates?.[0]?.content?.parts?.[0]?.text||"I couldn't generate a reply right now.";
  }catch(err){
    replyText="⚠️ Error connecting to Gemini API.";
    console.error(err);
  }

  typingDiv.innerHTML=`<strong>AI:</strong> <span class='fade-in'>${replyText}</span>`;
  chatBox.scrollTop=chatBox.scrollHeight;
  input.value="";
}
